services:
  postgres:
    image: postgres:16-alpine
    container_name: invoicepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoicepro
      POSTGRES_PASSWORD: invoicepro
      POSTGRES_DB: invoicepro
    ports:
      - "5432:5432"
    volumes:
      - invoicepro_pgdata:/var/lib/postgresql/data

volumes:
  invoicepro_pgdata:
